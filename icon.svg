<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#120e2e"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#00f5ff" stroke-width="6"/>
  <!-- Gaming Hub Controller Icon -->
  <g transform="translate(64, 80)" filter="url(#glow)">
    <path d="M 60 160 C 60 90, 110 50, 192 50 C 274 50, 324 90, 324 160 C 324 230, 290 280, 250 280 C 220 280, 206 250, 192 250 C 178 250, 164 280, 134 280 C 94 280, 60 230, 60 160 Z" fill="none" stroke="url(#neonCyan)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- D-pad -->
    <path d="M 120 135 L 120 185 M 95 160 L 145 160" stroke="#00f5ff" stroke-width="18" stroke-linecap="round"/>
    <!-- Action buttons -->
    <circle cx="260" cy="140" r="14" fill="#ff007a"/>
    <circle cx="288" cy="165" r="14" fill="#00f5ff"/>
    <circle cx="232" cy="165" r="14" fill="#ffbd00"/>
    <circle cx="260" cy="190" r="14" fill="#00ff88"/>
    <!-- Center badge -->
    <circle cx="192" cy="140" r="10" fill="#7928ca"/>
  </g>
  <text x="256" y="440" font-family="'Orbitron', sans-serif, system-ui" font-weight="900" font-size="44" fill="#00f5ff" text-anchor="middle" letter-spacing="4">GAMING HUB</text>
</svg>
